name: Validate and release Linux AppImage

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x64 on Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      appimage: ${{ steps.artifact.outputs.appimage }}
      checksum: ${{ steps.artifact.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2 libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm run lint:release
      - run: npm run licenses:check
      - run: npm run audit:security
      - name: Electron end-to-end tests
        run: xvfb-run -a -s '-screen 0 1600x1000x24' npm run test:e2e
      - name: Build and checksum AppImage
        run: npm run dist:linux
      - run: npm run check:package:linux
      - run: npm run check:artifact:linux
      - name: Packaged executable smoke test
        run: xvfb-run -a -s '-screen 0 1600x1000x24' npm run smoke:linux -- unpacked
      - name: Select current release assets
        id: artifact
        run: |
          node -e 'const a = require("./tools/packaging/linux-artifact"); const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `appimage=${a.artifactName}\nchecksum=${a.artifactName}.sha256\n`);'
      - name: Retain release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          if-no-files-found: error
          path: |
            dist/linux/${{ steps.artifact.outputs.appimage }}
            dist/linux/${{ steps.artifact.outputs.checksum }}
      - name: Retain build smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-diagnostics
          if-no-files-found: ignore
          path: out/linux-validation/

  validate:
    name: Run AppImage on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install desktop and FUSE dependencies
        shell: bash
        run: |
          sudo apt-get update
          if [[ '${{ matrix.os }}' == 'ubuntu-24.04' ]]; then
            sudo apt-get install -y xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libfuse2t64
          else
            sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2 libfuse2
          fi
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64-appimage
          path: dist/linux
      - name: Restore executable permission and verify downloaded artifact
        env:
          APPIMAGE_NAME: ${{ needs.build.outputs.appimage }}
        run: |
          chmod +x "dist/linux/$APPIMAGE_NAME"
          npm run check:artifact:linux
      - name: Test normal launch and extraction fallback using the same AppImage
        shell: bash
        run: |
          result=0
          for mode in appimage extracted; do
            if ! xvfb-run -a -s '-screen 0 1600x1000x24' npm run smoke:linux -- "$mode"; then
              result=1
            fi
          done
          exit "$result"
      - name: Retain compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-${{ matrix.os }}
          if-no-files-found: ignore
          path: out/linux-validation/

  release:
    name: Publish validated tag assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, validate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64-appimage
          path: dist/linux
      - name: Verify release bytes
        working-directory: dist/linux
        env:
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum }}
        run: sha256sum -c "$CHECKSUM_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_NAME: ${{ needs.build.outputs.appimage }}
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum }}
        shell: bash
        run: |
          appimage_path="dist/linux/$APPIMAGE_NAME"
          checksum_path="dist/linux/$CHECKSUM_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$appimage_path" "$checksum_path" --clobber
          else
            release_flags=(--verify-tag --generate-notes --title "Soapy Panels $GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "$appimage_path" "$checksum_path" "${release_flags[@]}"
          fi
